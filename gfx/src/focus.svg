<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <!-- Focus ring around a box with radius 8 at (8,8) 20x20: 2 px white, 2 px FOCUS, soft glow. -->
  <defs>
    <filter id="glow" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="2.5"/></filter>
    <mask id="m"><rect width="36" height="36" fill="#FFFFFF"/><rect x="8" y="8" width="20" height="20" rx="8" fill="#000000"/></mask>
  </defs>
  <g mask="url(#m)">
    <rect x="4" y="4" width="28" height="28" rx="12" fill="none" stroke="#2DB3F0" stroke-opacity="0.45" stroke-width="5" filter="url(#glow)"/>
    <rect x="5" y="5" width="26" height="26" rx="11" fill="none" stroke="#2DB3F0" stroke-width="2"/>
    <rect x="7" y="7" width="22" height="22" rx="9" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  </g>
</svg>
