<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Board frame on the top screen, 9-slice. Box 24x24 at (12,12), radius 8,
       3 px hard shadow and a soft green shadow. -->
  <defs><filter id="soft" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="4"/></filter></defs>
  <rect x="12" y="16" width="24" height="24" rx="8" fill="#284616" fill-opacity="0.18" filter="url(#soft)"/>
  <rect x="12" y="15" width="24" height="24" rx="8" fill="#000000" fill-opacity="0.10"/>
  <rect x="12" y="12" width="24" height="24" rx="8" fill="#FFFFFF"/>
</svg>
