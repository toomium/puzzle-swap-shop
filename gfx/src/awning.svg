<svg xmlns="http://www.w3.org/2000/svg" width="40" height="32" viewBox="0 0 40 32">
  <!-- Awning, one 40 px repeat: 3 px rod, 19 px cloth, 8 px scallops, 2 px drop shadow. Tiled horizontally. -->
  <defs>
    <clipPath id="sc"><rect x="0" y="22" width="40" height="8"/></clipPath>
    <clipPath id="sh"><rect x="0" y="24" width="40" height="8"/></clipPath>
  </defs>
  <g fill="#1E3C14" fill-opacity="0.14" clip-path="url(#sh)">
    <circle cx="10" cy="24" r="9.4"/><circle cx="30" cy="24" r="9.4"/>
  </g>
  <rect x="0" y="0" width="40" height="3" fill="#2E6E1C"/>
  <rect x="0" y="3" width="20" height="19" fill="#5BB83C"/>
  <rect x="20" y="3" width="20" height="19" fill="#FFFFFF"/>
  <rect x="0" y="19" width="40" height="3" fill="#000000" fill-opacity="0.05"/>
  <g clip-path="url(#sc)">
    <circle cx="10" cy="22" r="9.4" fill="#5BB83C"/>
    <circle cx="30" cy="22" r="9.4" fill="#FFFFFF"/>
  </g>
</svg>
